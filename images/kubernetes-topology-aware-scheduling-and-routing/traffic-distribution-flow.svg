<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <!-- svg-source:manual -->
  <title id="title">trafficDistribution 转发路径示例</title>
  <desc id="desc">C1 和 C2 访问未设置、PreferSameNode、PreferSameZone 三种 Service 时的 Endpoint 选择路径。</desc>
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: Virgil, "Comic Sans MS", "Noto Sans SC", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .zone-title { font-size: 27px; font-weight: 700; }
      .node-title { font-size: 21px; font-weight: 700; fill: #1f2937; }
      .label { font-size: 16px; font-weight: 650; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 13px; font-weight: 600; fill: #475569; }
      .pod-name { font-size: 16px; font-weight: 800; fill: #111827; }
      .pod-meta { font-size: 12px; font-weight: 650; fill: #475569; }
      .path-label { font-size: 13px; font-weight: 750; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="650" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" class="title">trafficDistribution 转发路径示例</text>

  <g aria-label="Legend">
    <rect x="145" y="76" width="990" height="25" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="170" y="83" width="18" height="12" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="196" y="94" class="tiny">Client Pod</text>
    <rect x="305" y="83" width="18" height="12" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="331" y="94" class="tiny">S1 unset</text>
    <rect x="445" y="83" width="18" height="12" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="471" y="94" class="tiny">S2 PreferSameNode</text>
    <rect x="655" y="83" width="18" height="12" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="681" y="94" class="tiny">S3 PreferSameZone</text>
    <line x1="870" y1="89" x2="915" y2="89" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrowBlue)"/>
    <text x="928" y="94" class="tiny">preferred</text>
    <line x1="1018" y1="89" x2="1063" y2="89" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowSlate)"/>
    <text x="1076" y="94" class="tiny">fallback / random</text>
  </g>

  <g aria-label="Zone A">
    <rect x="50" y="115" width="365" height="505" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.6"/>
    <text x="232.5" y="153" text-anchor="middle" class="zone-title" fill="#2563eb">Zone A</text>
    <text x="232.5" y="178" text-anchor="middle" class="small">C1: S2 同 Node，S3 同 Zone</text>

    <rect x="78" y="200" width="309" height="168" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="232.5" y="230" text-anchor="middle" class="node-title">Node1</text>
    <text x="232.5" y="253" text-anchor="middle" class="tiny">kubernetes.io/hostname=node-a1</text>

    <rect x="100" y="278" width="86" height="54" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="143" y="300" text-anchor="middle" class="pod-name">C1</text>
    <text x="143" y="320" text-anchor="middle" class="pod-meta">client</text>

    <rect x="250" y="278" width="112" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="306" y="300" text-anchor="middle" class="pod-name">S2-a</text>
    <text x="306" y="320" text-anchor="middle" class="pod-meta">same node</text>

    <rect x="78" y="400" width="309" height="175" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="232.5" y="430" text-anchor="middle" class="node-title">Node2</text>

    <rect x="105" y="470" width="112" height="54" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="161" y="492" text-anchor="middle" class="pod-name">S1-a</text>
    <text x="161" y="512" text-anchor="middle" class="pod-meta">ready endpoint</text>

    <rect x="250" y="470" width="112" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="306" y="492" text-anchor="middle" class="pod-name">S3-a</text>
    <text x="306" y="512" text-anchor="middle" class="pod-meta">same zone</text>
  </g>

  <g aria-label="Zone B">
    <rect x="457" y="115" width="365" height="505" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.6"/>
    <text x="639.5" y="153" text-anchor="middle" class="zone-title" fill="#16a34a">Zone B</text>
    <text x="639.5" y="178" text-anchor="middle" class="small">C2: S2/S3 无本地后端</text>

    <rect x="485" y="200" width="309" height="168" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="639.5" y="230" text-anchor="middle" class="node-title">Node1</text>
    <text x="639.5" y="253" text-anchor="middle" class="tiny">kubernetes.io/hostname=node-b1</text>

    <rect x="510" y="278" width="86" height="54" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="553" y="300" text-anchor="middle" class="pod-name">C2</text>
    <text x="553" y="320" text-anchor="middle" class="pod-meta">client</text>

    <rect x="660" y="278" width="112" height="54" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="716" y="300" text-anchor="middle" class="pod-name">S1-b</text>
    <text x="716" y="320" text-anchor="middle" class="pod-meta">ready endpoint</text>

    <rect x="485" y="400" width="309" height="175" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="639.5" y="430" text-anchor="middle" class="node-title">Node2</text>
    <rect x="520" y="485" width="239" height="42" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="639.5" y="512" text-anchor="middle" class="label">no S2/S3 local endpoint</text>
  </g>

  <g aria-label="Zone C">
    <rect x="864" y="115" width="365" height="505" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.6"/>
    <text x="1046.5" y="153" text-anchor="middle" class="zone-title" fill="#d97706">Zone C</text>
    <text x="1046.5" y="178" text-anchor="middle" class="small">C2 fallback 后命中远端后端</text>

    <rect x="892" y="200" width="309" height="168" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="1046.5" y="230" text-anchor="middle" class="node-title">Node1</text>
    <text x="1046.5" y="253" text-anchor="middle" class="tiny">kubernetes.io/hostname=node-c1</text>

    <rect x="918" y="278" width="112" height="54" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="974" y="300" text-anchor="middle" class="pod-name">S1-c</text>
    <text x="974" y="320" text-anchor="middle" class="pod-meta">ready endpoint</text>

    <rect x="1062" y="278" width="112" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1118" y="300" text-anchor="middle" class="pod-name">S2-c</text>
    <text x="1118" y="320" text-anchor="middle" class="pod-meta">fallback</text>

    <rect x="892" y="400" width="309" height="175" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
    <text x="1046.5" y="430" text-anchor="middle" class="node-title">Node2</text>

    <rect x="918" y="470" width="112" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="974" y="492" text-anchor="middle" class="pod-name">S3-c</text>
    <text x="974" y="512" text-anchor="middle" class="pod-meta">fallback</text>

    <rect x="1062" y="470" width="112" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1118" y="492" text-anchor="middle" class="pod-name">S2-d</text>
    <text x="1118" y="512" text-anchor="middle" class="pod-meta">fallback</text>
  </g>

  <g aria-label="Request paths in topology">
    <line x1="186" y1="305" x2="250" y2="305" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
    <rect x="194" y="272" width="82" height="24" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="235" y="289" text-anchor="middle" class="path-label">C1 -> S2</text>

    <path d="M 145 332 C 164 397, 224 452, 250 489" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
    <rect x="188" y="405" width="82" height="24" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="229" y="422" text-anchor="middle" class="path-label">C1 -> S3</text>

    <path d="M 127 332 C 88 389, 95 453, 113 484" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowSlate)"/>
    <rect x="91" y="377" width="112" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="147" y="394" text-anchor="middle" class="path-label">C1 -> S1 random</text>

    <line x1="596" y1="305" x2="660" y2="305" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowSlate)"/>
    <rect x="606" y="336" width="112" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="662" y="353" text-anchor="middle" class="path-label">C2 -> S1 random</text>

    <path d="M 596 292 C 724 216, 914 225, 1062 292" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
    <rect x="760" y="226" width="126" height="24" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="823" y="243" text-anchor="middle" class="path-label">C2 -> S2 fallback</text>

    <path d="M 553 332 C 655 446, 775 496, 918 497" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
    <rect x="713" y="452" width="126" height="24" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="776" y="469" text-anchor="middle" class="path-label">C2 -> S3 fallback</text>
  </g>
</svg>
