<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- svg-source:excalidraw -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="paper" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <g filter="url(#paper)">
<text x="640" y="58" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="34" font-weight="700" fill="#1f2937"><tspan x="640" dy="0">两个 API 的职责分工</tspan></text><rect x="90" y="135" width="500" height="430" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/><text x="340" y="185" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="30" font-weight="700" fill="#2563eb"><tspan x="340" dy="0">调度阶段</tspan></text><text x="340" y="228" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="24" font-weight="700" fill="#1f2937"><tspan x="340" dy="0">topologySpreadConstraints</tspan></text><rect x="150" y="285" width="380" height="185" rx="20" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/><text x="340" y="324" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="340" dy="0">输入：PodSpec + Node labels</tspan></text><text x="340" y="370" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="340" dy="0">目标：Pod 分散到 zone / node</tspan></text><text x="340" y="416" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="340" dy="0">结果：每个拓扑域都有 Endpoint</tspan></text><rect x="690" y="135" width="500" height="430" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/><text x="940" y="185" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="30" font-weight="700" fill="#16a34a"><tspan x="940" dy="0">转发阶段</tspan></text><text x="940" y="228" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="24" font-weight="700" fill="#1f2937"><tspan x="940" dy="0">trafficDistribution</tspan></text><rect x="750" y="285" width="380" height="185" rx="20" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/><text x="940" y="324" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="940" dy="0">输入：Service + EndpointSlice hints</tspan></text><text x="940" y="370" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="940" dy="0">目标：优先 same-zone / same-node</tspan></text><text x="940" y="416" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#1f2937"><tspan x="940" dy="0">结果：减少跨区访问</tspan></text><line x1="590" y1="350" x2="690" y2="350" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="640" y="333" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#1f2937"><tspan x="640" dy="0">配合</tspan></text><rect x="335" y="610" width="610" height="62" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/><text x="640" y="649" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Noto Sans SC', sans-serif" font-size="26" font-weight="700" fill="#1f2937"><tspan x="640" dy="0">先把 Endpoint 铺开，再让流量就近</tspan></text>
  </g>
</svg>
