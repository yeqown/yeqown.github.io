<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="2560" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">没有 Sentinel 时的 Redis Master 故障</title>
  <desc id="desc">客户端请求无法到达宕机的 Master，Master 到两个 Replica 的复制连接已经断开，但 Replica A 和 Replica B 仍然存活且没有被晋升。</desc>
  <defs>
    <pattern id="down-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#F7F8F4" />
      <line x1="0" y1="0" x2="0" y2="18" stroke="#202426" stroke-width="3" />
    </pattern>
    <marker id="request-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#202426" />
    </marker>
    <style>
      .font { font-family: "Cascadia Code", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #202426; }
      .paper { fill: #F7F8F4; }
      .teal { fill: #159E98; }
      .coral { fill: #E95D4F; }
      .request-line { fill: none; stroke: #202426; stroke-width: 4; stroke-linecap: round; marker-end: url(#request-arrow); }
      .replication-line { fill: none; stroke: #159E98; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#F7F8F4" />

  <text class="font ink label" x="64" y="88" font-size="38">有副本，不等于服务能自动恢复</text>

  <rect x="890" y="45" width="326" height="68" rx="6" fill="#F7F8F4" stroke="#E8BD3F" stroke-width="3" stroke-dasharray="10 9" />
  <text class="font ink label" x="1053" y="89" font-size="28" text-anchor="middle">无 Sentinel：无人切主</text>

  <rect x="60" y="235" width="240" height="270" rx="6" fill="#202426" stroke="#202426" stroke-width="3" />
  <text class="font paper label" x="180" y="300" font-size="30" text-anchor="middle">应用客户端</text>
  <rect x="85" y="320" width="190" height="155" rx="5" fill="#F7F8F4" stroke="#F7F8F4" stroke-width="2" />
  <text class="font coral label" x="180" y="370" font-size="28" text-anchor="middle">请求超时</text>
  <text class="font coral label" x="180" y="425" font-size="28" text-anchor="middle">连接异常</text>

  <text class="font ink label" x="320" y="298" font-size="28">GET</text>
  <text class="font ink label" x="320" y="358" font-size="28">SET</text>
  <text class="font ink label" x="320" y="418" font-size="28">INCR</text>
  <path class="request-line" d="M 300 310 H 425" />
  <path class="request-line" d="M 300 370 H 425" />
  <path class="request-line" d="M 300 430 H 425" />

  <g class="font coral label" font-size="24" text-anchor="middle">
    <circle cx="454" cy="310" r="16" fill="#F7F8F4" stroke="#E95D4F" stroke-width="3" />
    <text x="454" y="318">x</text>
    <circle cx="454" cy="370" r="16" fill="#F7F8F4" stroke="#E95D4F" stroke-width="3" />
    <text x="454" y="378">x</text>
    <circle cx="454" cy="430" r="16" fill="#F7F8F4" stroke="#E95D4F" stroke-width="3" />
    <text x="454" y="438">x</text>
  </g>
  <text class="font coral label" x="385" y="513" font-size="32" text-anchor="middle">请求不可达</text>

  <rect x="490" y="235" width="210" height="255" rx="7" fill="url(#down-hatch)" stroke="#202426" stroke-width="4" stroke-dasharray="13 11" />
  <rect x="520" y="315" width="150" height="100" rx="5" fill="#F7F8F4" stroke="#F7F8F4" stroke-width="2" />
  <text class="font ink label" x="595" y="360" font-size="32" text-anchor="middle">Master</text>
  <text class="font coral label" x="595" y="405" font-size="28" text-anchor="middle">宕机</text>

  <text class="font teal label" x="760" y="336" font-size="28" text-anchor="middle">异步复制</text>
  <path class="replication-line" d="M 700 362 H 760 M 760 270 V 480 M 760 270 H 802 M 840 270 H 870 M 760 480 H 802 M 840 480 H 870" />

  <g class="font coral label" font-size="24" text-anchor="middle">
    <circle cx="820" cy="270" r="16" fill="#F7F8F4" stroke="#E95D4F" stroke-width="3" />
    <text x="820" y="278">x</text>
    <circle cx="820" cy="480" r="16" fill="#F7F8F4" stroke="#E95D4F" stroke-width="3" />
    <text x="820" y="488">x</text>
  </g>
  <text class="font coral label" x="755" y="568" font-size="28" text-anchor="middle">复制连接断开</text>

  <rect x="870" y="200" width="330" height="140" rx="7" fill="#F7F8F4" stroke="#159E98" stroke-width="4" />
  <circle cx="914" cy="270" r="12" fill="#159E98" stroke="#202426" stroke-width="2" />
  <text class="font ink label" x="950" y="257" font-size="30">Replica A</text>
  <text class="font teal label" x="950" y="309" font-size="28">存活</text>

  <rect x="870" y="410" width="330" height="140" rx="7" fill="#F7F8F4" stroke="#159E98" stroke-width="4" />
  <circle cx="914" cy="480" r="12" fill="#159E98" stroke="#202426" stroke-width="2" />
  <text class="font ink label" x="950" y="467" font-size="30">Replica B</text>
  <text class="font teal label" x="950" y="519" font-size="28">存活</text>

  <text class="font teal label" x="1035" y="630" font-size="28" text-anchor="middle">数据副本仍在，但无人晋升</text>
</svg>
