<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">VictoriaLogs 存储层级与 Part 文件</title>
  <desc id="desc">Storage 按 UTC 日期拆分 Partition，每个 Partition 包含 indexdb 和 datadb Part；Block 是 Part 内的逻辑单元，数据通过 Part 目录中的共享文件按偏移读取。</desc>
  <defs>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; letter-spacing: 0; }
      .title { font-size: 40px; font-weight: 700; fill: #1F2937; }
      .subtitle { font-size: 20px; fill: #64748B; }
      .step { font-size: 24px; font-weight: 700; fill: #4E7CF6; }
      .heading { font-size: 23px; font-weight: 700; fill: #1F2937; }
      .label { font-size: 22px; font-weight: 700; fill: #1F2937; text-anchor: middle; }
      .body { font-size: 17px; fill: #374151; }
      .file { font-size: 16px; fill: #374151; }
      .file-small { font-size: 15px; fill: #374151; }
      .note { font-size: 18px; font-weight: 600; fill: #2AB7CA; text-anchor: middle; }
      .outline { stroke: #1F2937; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .data-flow { fill: none; stroke: #4E7CF6; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#4E7CF6"/>
    </marker>
  </defs>

  <rect width="1440" height="810" fill="#FFFFFF"/>
  <text class="title" x="72" y="82">VictoriaLogs 存储层级与 Part 文件</text>
  <text class="subtitle" x="72" y="126">Storage → 按日 Partition → indexdb / datadb Part → 逻辑 Block 与共享文件</text>

  <text class="step" x="72" y="192">1  Storage</text>
  <text class="step" x="316" y="192">2  Partition</text>
  <text class="step" x="590" y="192">3  Part</text>
  <text class="step" x="900" y="192">4  文件布局</text>

  <g aria-label="Storage">
    <rect x="72" y="292" width="170" height="136" rx="16" fill="#EAF7F0" class="outline"/>
    <rect x="121" y="330" width="72" height="48" fill="#EAF7F0" class="outline"/>
    <ellipse cx="157" cy="330" rx="36" ry="12" fill="#55B685" class="outline"/>
    <ellipse cx="157" cy="378" rx="36" ry="12" fill="#55B685" class="outline"/>
    <ellipse cx="157" cy="354" rx="36" ry="10" fill="none" stroke="#55B685" stroke-width="2"/>
    <text class="label" x="157" y="470">Storage</text>
    <text x="157" y="498" font-size="17" fill="#64748B" text-anchor="middle">storageDataPath/</text>
  </g>

  <path class="data-flow" d="M242 360H316"/>

  <g aria-label="按日 Partition">
    <rect x="316" y="262" width="220" height="236" rx="16" fill="#EAF0FF" class="outline"/>
    <rect x="414" y="294" width="24" height="24" rx="6" fill="#4E7CF6" class="outline"/>
    <path d="M426 318v14l-30 20M426 332l30 20" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="382" y="352" width="32" height="36" rx="6" fill="#FFF6DD" class="outline"/>
    <rect x="420" y="352" width="32" height="36" rx="6" fill="#EAF7F0" class="outline"/>
    <rect x="458" y="352" width="32" height="36" rx="6" fill="#E7F7F8" class="outline"/>
    <text class="label" x="426" y="408">Partition</text>
    <text x="426" y="435" font-size="18" fill="#374151" text-anchor="middle">YYYYMMDD</text>
    <rect x="340" y="452" width="76" height="32" rx="8" fill="#FFF6DD" stroke="#F2BD4D" stroke-width="2"/>
    <text x="378" y="474" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle">indexdb</text>
    <rect x="436" y="452" width="76" height="32" rx="8" fill="#EAF7F0" stroke="#55B685" stroke-width="2"/>
    <text x="474" y="474" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle">datadb</text>
  </g>

  <path class="data-flow" d="M536 340H560V306H590"/>
  <path class="data-flow" d="M536 420H560V516H590"/>

  <g aria-label="indexdb Part">
    <rect x="590" y="222" width="250" height="184" rx="16" fill="#FFF6DD" stroke="#F2BD4D" stroke-width="2"/>
    <path d="M618 258h54M618 278h44M618 298h34" fill="none" stroke="#F2BD4D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="689" cy="295" r="19" fill="#FFFFFF" class="outline"/>
    <path d="m703 309 19 19" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="766" y="274">indexdb Part</text>
    <text class="body" x="715" y="352" text-anchor="middle">Stream 索引</text>
    <text class="body" x="715" y="380" text-anchor="middle">存在条目 · 标签映射 · 倒排索引</text>
  </g>

  <g aria-label="datadb Part 与逻辑 Block">
    <rect x="590" y="454" width="250" height="250" rx="16" fill="#EAF7F0" stroke="#55B685" stroke-width="2"/>
    <text class="label" x="715" y="500">datadb Part</text>
    <text class="body" x="715" y="532" text-anchor="middle">按 streamID、timestamp 排序</text>
    <rect x="614" y="560" width="202" height="40" rx="8" fill="#E7F7F8" stroke="#2AB7CA" stroke-width="2"/>
    <text class="body" x="715" y="586" text-anchor="middle">Block A · Stream 1</text>
    <rect x="614" y="610" width="202" height="40" rx="8" fill="#E7F7F8" stroke="#2AB7CA" stroke-width="2"/>
    <text class="body" x="715" y="636" text-anchor="middle">Block B · Stream 1</text>
    <rect x="614" y="660" width="202" height="30" rx="8" fill="#E7F7F8" stroke="#2AB7CA" stroke-width="2"/>
    <text x="715" y="681" font-size="16" fill="#374151" text-anchor="middle">Block C · Stream 2</text>
  </g>

  <path class="data-flow" d="M840 314H900"/>
  <path class="data-flow" d="M840 579H900"/>

  <g aria-label="indexdb 文件">
    <rect x="900" y="212" width="468" height="210" rx="16" fill="#FFFCF2" stroke="#F2BD4D" stroke-width="2"/>
    <text class="heading" x="928" y="255">indexdb/</text>
    <line x1="1100" y1="276" x2="1100" y2="392" stroke="#E5D59B" stroke-width="2"/>
    <text class="body" x="928" y="302" font-weight="600">目录级清单</text>
    <text class="body" x="928" y="334">parts.json</text>
    <text class="body" x="1120" y="302" font-weight="600">Part 目录</text>
    <text class="file" x="1120" y="330">metadata.json</text>
    <text class="file" x="1120" y="356">metaindex.bin · index.bin</text>
    <text class="file" x="1120" y="382">items.bin · lens.bin</text>
  </g>

  <g aria-label="datadb 文件">
    <rect x="900" y="454" width="468" height="286" rx="16" fill="#F8FCFA" stroke="#55B685" stroke-width="2"/>
    <text class="heading" x="928" y="496">datadb/</text>
    <line x1="1128" y1="512" x2="1128" y2="716" stroke="#B7DDC9" stroke-width="2"/>

    <text class="file" x="928" y="532" font-weight="700">目录级清单</text>
    <text class="file" x="928" y="556">parts.json</text>
    <text class="file" x="928" y="594" font-weight="700">Part 元数据 / 索引</text>
    <text class="file" x="928" y="618">metadata.json</text>
    <text class="file" x="928" y="642">metaindex.bin · index.bin</text>
    <text class="file" x="928" y="666">column_names.bin</text>
    <text class="file" x="928" y="690">column_idxs.bin</text>

    <text class="file-small" x="1144" y="532" font-weight="700">Block 数据（共享 Part 文件）</text>
    <text class="file-small" x="1144" y="556">columns_header_index.bin</text>
    <text class="file-small" x="1144" y="578">columns_header.bin</text>
    <text class="file-small" x="1144" y="600">timestamps.bin</text>
    <text class="file-small" x="1144" y="622">message_bloom.bin</text>
    <text class="file-small" x="1144" y="644">message_values.bin</text>
    <text class="file-small" x="1144" y="666">bloom.bin{shardIdx}</text>
    <text class="file-small" x="1144" y="688">values.bin{shardIdx}</text>
  </g>

  <text class="note" x="1110" y="774">Block 是逻辑单元，不单独建目录；{shardIdx} 是从 0 开始的索引。</text>
</svg>
