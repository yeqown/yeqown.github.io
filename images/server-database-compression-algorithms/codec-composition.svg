<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1440 810" width="2880" height="1620">
  <!-- svg-source:excalidraw -->
  <defs>
