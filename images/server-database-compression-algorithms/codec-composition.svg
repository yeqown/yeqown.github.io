  <rect x="0" y="0" width="1440" height="810" fill="#F8FAFC" />
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="1440" height="810" rx="0" stroke="#F8FAFC" fill="#F8FAFC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="80" y="69.05">五种 LZ 系 Codec：共同主干相同，后续表示不同</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">
      <tspan x="80" y="104.73">这里只画压缩路径；各格式支持的 block 不一定都进入压缩分支。</tspan>
    </text>
    <ellipse cx="225" cy="191" rx="145" ry="46" stroke="#4E7CF6" fill="#EAF0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="225" y="196.17">不带字段语义的字节流</tspan>
    </text>
    <path d="M 382 191 L 450 191" stroke="#4E7CF6" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4e7cf6)" />
    <rect x="462" y="145" width="290" height="92" rx="14" stroke="#4E7CF6" fill="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="607" y="182.64">寻找重复片段</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">
      <tspan x="607" y="214.23">LZ77-like 历史匹配</tspan>
    </text>
    <path d="M 764 191 L 832 191" stroke="#4E7CF6" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4e7cf6)" />
    <rect x="844" y="130" width="516" height="122" rx="14" stroke="#4E7CF6" fill="#EAF0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1102" y="174.11">未匹配字节 + 引用指令</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">
      <tspan x="1102" y="214.97">length / distance 等字段因格式而异</tspan>
    </text>
    <path d="M 1102 264 L 1102 306" stroke="#4E7CF6" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4e7cf6)" />
    <path d="M 255 318 L 1102 318" stroke="#4E7CF6" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="255" cy="318" rx="8" ry="8" stroke="#55B685" fill="#55B685" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 255 332 L 255 368" stroke="#55B685" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-55b685)" />
    <rect x="80" y="380" width="350" height="328" rx="14" stroke="#55B685" fill="#EAF7F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 104 410 L 104 670" stroke="#55B685" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="130" y="433.11">LZ4 / Snappy</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="130" y="482.17">直接保存字节指令</tspan>
    </text>
    <rect x="130" y="516" width="260" height="72" rx="14" stroke="#55B685" fill="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="260" y="556.7">literal | copy / match</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="130" y="632.68">固定字节格式；</tspan>
      <tspan x="130" y="656.98">没有熵编码后端</tspan>
    </text>
    <ellipse cx="685" cy="318" rx="8" ry="8" stroke="#F2BD4D" fill="#F2BD4D" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 685 332 L 685 368" stroke="#F2BD4D" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-f2bd4d)" />
    <rect x="510" y="380" width="350" height="328" rx="14" stroke="#F2BD4D" fill="#FFF7E3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 534 410 L 534 670" stroke="#F2BD4D" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="560" y="433.11">DEFLATE / Brotli</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="560" y="482.17">再用 Huffman 表示符号</tspan>
    </text>
    <rect x="560" y="516" width="260" height="72" rx="14" stroke="#F2BD4D" fill="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="690" y="556.7">literal / length | distance</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">
      <tspan x="560" y="623.2">DEFLATE：fixed / dynamic code</tspan>
      <tspan x="560" y="646.15">Brotli：上下文建模 +</tspan>
      <tspan x="560" y="669.1">格式内置静态字典引用</tspan>
    </text>
    <ellipse cx="1102" cy="318" rx="8" ry="8" stroke="#8C72D6" fill="#8C72D6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1102 332 L 1102 368" stroke="#8C72D6" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-8c72d6)" />
    <rect x="940" y="380" width="420" height="328" rx="14" stroke="#8C72D6" fill="#F1EDFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1150" y="427.88">Zstandard Compressed Block</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1150" y="470.94">先拆 section，再分别选模式</tspan>
    </text>
    <path d="M 1150 492 L 1150 522" stroke="#8C72D6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1150 522 L 996 522 L 996 545" stroke="#8C72D6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-8c72d6)" />
    <path d="M 1150 522 L 1304 522 L 1304 545" stroke="#8C72D6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-8c72d6)" />
    <rect x="960" y="552" width="190" height="96" rx="14" stroke="#8C72D6" fill="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1055" y="582.75">Literals</tspan>
      <tspan x="1055" y="604">Raw / RLE</tspan>
      <tspan x="1055" y="625.25">Huffman / Treeless</tspan>
    </text>
    <rect x="1170" y="552" width="170" height="96" rx="14" stroke="#8C72D6" fill="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1255" y="583.76">Sequence codes</tspan>
      <tspan x="1255" y="603.76">Predefined / RLE</tspan>
      <tspan x="1255" y="623.76">FSE / Repeat</tspan>
    </text>
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="1150" y="678.26">Treeless / Repeat 复用已有表</tspan>
    </text>
    <rect x="286" y="724" width="868" height="44" rx="14" stroke="#1F2937" fill="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" />
    <text font-family="Helvetica, Arial, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">
      <tspan x="720" y="750">Huffman 和 FSE 都不是无条件必经步骤；收益不足时可以原样保存、RLE 或复用已有表。</tspan>
    </text>
  </g>
</svg>