<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Redis 稳态复制时序</title>
  <desc id="desc">主节点标题旁单独标注 RDB / AOF 本地持久化能力，该标注不属于复制时序；客户端写入后主节点先返回 OK，再发送复制流并收到副本 ACK。</desc>
  <defs>
    <marker id="arrow-charcoal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#202426"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#159E98"/></marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E95D4F"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E8BD3F"/></marker>
  </defs>
  <rect width="900" height="1000" fill="#F7F8F4"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" fill="#202426">
    <text x="450" y="55" text-anchor="middle" font-size="30" font-weight="700">Redis 稳态复制：确认与复制并不同步</text>
    <text x="160" y="121" text-anchor="middle" font-size="25" font-weight="700">客户端</text>
    <text x="450" y="121" text-anchor="middle" font-size="25" font-weight="700" fill="#159E98">主节点</text>
    <text x="740" y="121" text-anchor="middle" font-size="25" font-weight="700">副本节点</text>
    <line x1="450" y1="128" x2="450" y2="145" stroke="#202426" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="270" y="145" width="360" height="95" rx="7" fill="#F7F8F4" stroke="#202426" stroke-width="2" aria-label="RDB / AOF：本地持久化。本地能力，不表示复制时序"/>
    <text x="450" y="181" text-anchor="middle" font-size="25">RDB / AOF：本地持久化</text>
    <text x="450" y="213" text-anchor="middle" font-size="25">本地能力，不表示复制时序</text>
    <line x1="80" y1="255" x2="820" y2="255" stroke="#202426" stroke-width="2" stroke-dasharray="8 7"/>
    <line x1="160" y1="275" x2="160" y2="885" stroke="#202426" stroke-width="2"/>
    <line x1="450" y1="275" x2="450" y2="885" stroke="#159E98" stroke-width="3"/>
    <line x1="740" y1="275" x2="740" y2="885" stroke="#202426" stroke-width="2"/>
    <text x="305" y="315" text-anchor="middle" font-size="25" font-family="ui-monospace, monospace">SET order:42 paid</text>
    <line x1="160" y1="330" x2="445" y2="330" stroke="#202426" stroke-width="3" marker-end="url(#arrow-charcoal)"/>
    <circle cx="450" cy="407" r="10" fill="#159E98"/>
    <text x="320" y="455" text-anchor="middle" font-size="25" aria-label="主节点执行并进入复制流">主节点执行并</text>
    <text x="320" y="487" text-anchor="middle" font-size="25">进入复制流</text>
    <text x="305" y="537" text-anchor="middle" font-size="25" font-weight="700" fill="#E95D4F">OK</text>
    <line x1="450" y1="555" x2="165" y2="555" stroke="#E95D4F" stroke-width="4" marker-end="url(#arrow-coral)"/>
    <line x1="480" y1="575" x2="480" y2="650" stroke="#E95D4F" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="500" y="610" font-size="25" font-weight="700" fill="#E95D4F">未复制风险窗口</text>
    <text x="595" y="677" text-anchor="middle" font-size="25" fill="#159E98">复制流：offset 10120...</text>
    <line x1="450" y1="695" x2="735" y2="695" stroke="#159E98" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <text x="595" y="790" text-anchor="middle" font-size="25">ACK：已处理到 10152</text>
    <line x1="740" y1="810" x2="455" y2="810" stroke="#E8BD3F" stroke-width="4" marker-end="url(#arrow-amber)"/>
    <text x="450" y="956" text-anchor="middle" font-size="27" font-weight="700" fill="#E95D4F">OK 先返回；副本 ACK 后到达</text>
  </g>
</svg>
